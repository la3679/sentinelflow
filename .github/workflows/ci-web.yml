name: CI — web

# Deliberately not path-filtered. A workflow skipped by an `on: paths` filter
# produces no check run at all, which permanently blocks a pull request when the
# same check is required by a branch ruleset. The suite costs a few minutes on a
# free public runner; revisit filtering when the runtime justifies the
# complexity of job-level change detection. See docs/adr/0002.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: this workflow only needs to read the repository.
permissions:
  contents: read

# Supersede in-flight runs for the same ref.
concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.4.0"

defaults:
  run:
    working-directory: apps/web

jobs:
  quality:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      # Third-party action pinned to an immutable commit SHA.
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # The Bun workspace root owns the single lockfile, so the install runs
      # from the repository root and links apps/web from it.
      - name: Install dependencies
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests with coverage
        run: bun run test:coverage

      - name: Build
        run: bun run build

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: web-coverage
          path: apps/web/coverage/
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    name: Browser, accessibility, and responsive checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        working-directory: .
        run: bun install --frozen-lockfile

      # vite preview serves the built output, so the build must exist before the
      # Playwright webServer starts. Without this the preview server exits with
      # ERR_MODULE_NOT_FOUND on dist/server/server.js and Playwright times out.
      - name: Build
        run: bun run build

      # Only Chromium is required: both Playwright projects run on it, one at a
      # desktop viewport and one at a tablet viewport.
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright suite
        run: bun run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
