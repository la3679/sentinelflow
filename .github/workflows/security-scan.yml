name: Security — secrets and dependencies

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly re-scan so a newly published advisory is noticed without a push.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # gitleaks enumerates the commits of a pull request via the REST API;
      # without this it fails with 403 "Resource not accessible by integration".
      pull-requests: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Full history so the scan covers every commit, not just the tip.
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Dependency review needs the dependency graph, which GitHub provides free
    # on public repositories but gates behind paid Advanced Security on private
    # ones. This job is therefore skipped while the repository is private and
    # starts running by itself once it is public. The control is deferred, not
    # disabled: secret scanning still runs on every event.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.repository.visibility == 'public'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
          # SentinelFlow is Apache-2.0; copyleft licences are incompatible.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0
