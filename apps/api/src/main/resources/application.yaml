# Default configuration for the SentinelFlow API.
#
# Only non-secret settings carry a value here. Anything credential-bearing is
# read from the environment and has no default, so a missing variable fails
# startup loudly instead of silently falling back to something insecure.

spring:
  application:
    name: sentinelflow-api

  # Reject unknown properties at startup rather than ignoring a typo in a
  # configuration key until the behaviour it was meant to change is missed.
  main:
    banner-mode: "off"

  datasource:
    # No default for the password: a missing variable must stop startup, not
    # silently connect somewhere with a guessable one. The host defaults to the
    # compose service name, which is what the container needs; a developer
    # running the API outside the stack overrides it to localhost.
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_INTERNAL_PORT:5432}/${POSTGRES_DB:sentinelflow}
    username: ${POSTGRES_USER:sentinelflow}
    password: ${POSTGRES_PASSWORD}
    hikari:
      # Named so a connection holding a lock is attributable in pg_stat_activity
      # rather than showing up as one of ten identical "PostgreSQL JDBC Driver".
      pool-name: sentinelflow-api-pool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      # Milliseconds, not a Duration. Everything under spring.datasource.hikari
      # is bound straight onto HikariDataSource, whose setters take a plain
      # long - Boot's Duration conversion never gets a chance, and `10s` fails
      # startup with NumberFormatException. Only running the service shows this.
      connection-timeout: 10000
      # 25 minutes. Below PostgreSQL's default idle_session_timeout and any
      # sensible proxy timeout, so the pool discards a connection before the
      # server does.
      max-lifetime: 1500000

  jpa:
    hibernate:
      # validate, never update, never create-drop. Flyway owns the schema
      # (ADR-0007); Hibernate's job is to refuse to start when the mappings and
      # the schema have drifted apart, which is a defect worth failing on.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # A JDBC batch is only worth configuring alongside ordered inserts and
        # updates; without the ordering the batch is broken up again.
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
        # An implicit query-time fetch of a lazy association is a latent N+1.
        # Failing loudly in every environment is the only way it stays fixed.
        query.fail_on_pagination_over_collection_fetch: true

  jackson:
    deserialization:
      # The contracts declare additionalProperties: false. Bean Validation has
      # no equivalent, so this is what enforces it: a client's typo becomes a
      # 400 naming the problem rather than a field silently ignored and a
      # transaction quietly recorded with a default the caller never chose.
      fail-on-unknown-properties: true
    # Nulls are serialised, not dropped. The event schemas require fields like
    # deviceReference to be present and null rather than absent, so a consumer
    # never has to distinguish "this channel has no device" from "the producer
    # forgot the field". non_null inclusion would silently break that, and did
    # until a test noticed.
    default-property-inclusion: always

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # acks=all with idempotence. The outbox guarantees an event is not lost
      # before publication; these are what stop it being lost during it. A
      # leader acknowledging alone can lose the record when it fails before its
      # replicas catch up, and without idempotence a producer-side retry can
      # write the same record twice within one send.
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        # Bounded, and shorter than the relay's own send timeout, so a failure
        # surfaces as a retryable publication error rather than as a claim
        # holding row locks while the producer waits.
        delivery.timeout.ms: 20000
        request.timeout.ms: 10000
        linger.ms: 5
    consumer:
      # The group is also the consumer_name written to processed_events, so
      # "what Kafka redelivers to" and "what deduplication is scoped to" are the
      # same thing by construction rather than by two settings agreeing.
      group-id: transaction-risk
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # earliest, not latest. A consumer starting for the first time against a
      # topic that already has events must read them: skipping to the end would
      # silently drop everything published before it existed, and the outbox
      # would show them published with nothing having happened.
      auto-offset-reset: earliest
      # Offsets are committed by the container after the listener returns, not
      # on a timer. Auto-commit acknowledges records that are still being
      # processed, so a crash loses them while the offset says otherwise.
      enable-auto-commit: false
      # Bounds how much work one poll can hand to a listener that then blocks on
      # a retry, which is what keeps max.poll.interval.ms honest.
      max-poll-records: 50
    listener:
      # One offset per record. The alternative commits a batch, which after a
      # partial failure either re-delivers records that succeeded or commits
      # past records that did not.
      ack-mode: record
      # Reads the traceparent the relay replayed onto the record and continues
      # that trace, so handling a transaction.created is a child of the API
      # request that ingested the transaction rather than a trace of its own
      # (ADR-0016 section 5).
      #
      # Only the listener side. The producer side stays off deliberately:
      # KafkaEventPublisher writes the header itself from the value stored on
      # the outbox row, and template observation would overwrite that with the
      # scheduler thread's context - which is exactly the second, disconnected
      # trace this arrangement exists to avoid.
      observation-enabled: true

  flyway:
    enabled: true
    # No baseline-on-migrate: it exists to adopt a database that already has a
    # schema, and adopting an unknown schema silently is the failure mode this
    # project most wants to avoid. This database is created by these migrations
    # or it is not ours.
    baseline-on-migrate: false
    validate-on-migrate: true
    # A merged migration is immutable. Refusing to run out of order is what
    # makes that true in an environment rather than only in the review.
    out-of-order: false
    locations: classpath:db/migration

# Demo data. Off in every environment, including local: a service that
# populates whatever database it is pointed at is a service nobody can safely
# point at anything. Turn it on deliberately, for one run.
sentinelflow:
  outbox:
    # The relay. On by default: an outbox nobody drains is a queue that only
    # grows, and a service that silently stops publishing is worse than one that
    # fails loudly. Turned off in tests that drive a drain directly, so a
    # scheduled thread cannot publish a row out from under an assertion.
    enabled: ${SENTINELFLOW_OUTBOX_ENABLED:true}
    # The publication delay, and the honest cost of the outbox (ADR-0005).
    # Nothing in this pipeline is real-time.
    poll-interval: ${SENTINELFLOW_OUTBOX_POLL_INTERVAL:500ms}
    # Bounds how long one claim holds row locks when the broker is slow.
    batch-size: ${SENTINELFLOW_OUTBOX_BATCH_SIZE:100}
    retry-base: 1s
    retry-max-delay: 5m
    # About 25 minutes of trying: long enough to ride out a broker restart,
    # short enough that a genuinely broken event is visible within the hour.
    max-attempts: 10

  consumer:
    # The transaction.created listener. On by default, for the same reason the
    # relay is: a pipeline half nobody notices is switched off is worse than one
    # that fails loudly. Turned off in the many test contexts that need the
    # schema and no broker, because a listener whose bootstrap address does not
    # resolve fails the whole application context at startup.
    enabled: ${SENTINELFLOW_CONSUMER_ENABLED:true}
    # A consumer's retry blocks its partition, so this budget is spent against
    # every record queued behind the one that is failing. That is why it looks
    # like the outbox's and is an order of magnitude shorter: the relay is
    # waiting for a broker with one row in hand, and this is holding up a
    # partition (ADR-0006 section 4).
    retry-base: 500ms
    retry-max-delay: 20s
    # Five deliveries, so roughly half a minute of trying before the record is
    # dead-lettered and the partition moves on.
    max-attempts: 5

  observability:
    kafka:
      # Consumer lag and dead-letter depth, read from the broker with an admin
      # client (ADR-0016 section 6). On by default and off in the test contexts
      # that need the schema and no Kafka, exactly like the consumer above: a
      # scheduled task retrying an address that does not resolve turns an
      # unrelated suite into a wall of connection warnings.
      enabled: ${SENTINELFLOW_OBSERVABILITY_KAFKA_ENABLED:true}
      # Matched to prometheus.yml's scrape_interval. Reading faster produces
      # values nothing collects; reading slower means a scrape sometimes lands
      # on a fresh figure and sometimes on one a full interval old, which is a
      # sawtooth on a graph that should be flat.
      refresh-interval: ${SENTINELFLOW_OBSERVABILITY_KAFKA_REFRESH_INTERVAL:15s}
      # The ceiling on one round of admin calls. This runs on the scheduler, not
      # on a request thread, so it cannot hurt a caller - but without a bound a
      # slow broker leaves rounds overlapping and a gauge minutes out of date
      # presented as current.
      timeout: ${SENTINELFLOW_OBSERVABILITY_KAFKA_TIMEOUT:5s}

  scoring:
    context:
      # How much account history crosses the scoring boundary (ADR-0008), and
      # what the same assembler puts in the labelled training export (ADR-0010
      # section 1). Both values are stated on every request rather than assumed
      # by the service, because a feature defined over 24 hours that only
      # received an hour of history is not a smaller number - it is a number
      # meaning something other than what its name says.
      #
      # 24 hours is the longest window any current feature is defined over: the
      # 24-hour amount sum. Shortening it makes that feature wrong rather than
      # cheaper, and the service warns rather than answering confidently.
      lookback-window: ${SENTINELFLOW_SCORING_LOOKBACK_WINDOW:24h}
      # The contract declares maxItems 200 and the properties class clamps to
      # it, so a larger value here cannot produce a request the service is
      # required to reject. Bounded on purpose: a request that grew with an
      # account's history would be a denial-of-service primitive.
      max-recent-transactions: ${SENTINELFLOW_SCORING_MAX_RECENT_TRANSACTIONS:200}

    client:
      # Calling the scoring service (ADR-0008 section 3). Every number here is
      # small for one reason: this call happens inside a Kafka consumer that
      # retries by blocking its partition, so everything queued behind a record
      # waits for it. The whole budget is validated at startup against a
      # ten-second ceiling rather than left as an intention.
      #
      # The service name on the compose network, not the published port. The
      # published one exists so a developer can curl it.
      base-url: ${SENTINELFLOW_SCORING_BASE_URL:http://scoring:8000}
      # A reachable service on this network connects immediately, so a longer
      # value only delays the discovery that it is not there.
      connect-timeout: ${SENTINELFLOW_SCORING_CONNECT_TIMEOUT:1s}
      # Inference is arithmetic over a nineteen-column vector. A slow answer is
      # a sick service, and waiting longer produces a stale score rather than a
      # better one.
      read-timeout: ${SENTINELFLOW_SCORING_READ_TIMEOUT:2s}
      # Three attempts. Enough for a restart or a dropped connection; a
      # dependency that fails three times in a row is not about to succeed on
      # the fourth, and the degraded path exists so it does not have to.
      max-retries: ${SENTINELFLOW_SCORING_MAX_RETRIES:2}
      # Full jitter, the same distribution as the outbox and the consumer.
      # Without it, everything that failed during an outage retries in lockstep
      # the instant it recovers and knocks it over again.
      retry-base: ${SENTINELFLOW_SCORING_RETRY_BASE:100ms}
      retry-max-delay: ${SENTINELFLOW_SCORING_RETRY_MAX_DELAY:1s}
      # The part that matters at scale. Without a breaker every record in a
      # backlog pays the full timeout before degrading, so a scoring outage
      # becomes consumer lag proportional to traffic.
      circuit-breaker-failure-threshold: ${SENTINELFLOW_SCORING_BREAKER_THRESHOLD:5}
      # Long enough for a container to restart, short enough that a recovered
      # service is scoring again within a minute.
      circuit-breaker-open-duration: ${SENTINELFLOW_SCORING_BREAKER_OPEN:30s}

    export:
      # The labelled training dataset (ADR-0010 section 1). Off unless asked,
      # like the seed and for the same reason: it writes files and reads the
      # whole transaction table, and an application that does either wherever it
      # is pointed is one nobody can safely point anywhere.
      enabled: ${SENTINELFLOW_SCORING_EXPORT_ENABLED:false}
      # Under data/generated/, which .gitignore already excludes. ADR-0010
      # section 1 says the dataset is regenerated from a recorded seed rather
      # than committed, and the surest way to honour that is to write it
      # somewhere Git will not offer to add.
      directory: ${SENTINELFLOW_SCORING_EXPORT_DIRECTORY:data/generated/training}
      # An export is reproducible, so rewriting one is either pointless work or
      # the loss of a dataset whose metrics someone has already published.
      overwrite: ${SENTINELFLOW_SCORING_EXPORT_OVERWRITE:false}

  risk:
    policy:
      # How a rule score and a model score become the one number a band and,
      # from Phase 5, an alert are derived from (ADR-0011).
      #
      # Persisted on every assessment as policy_version, beside the model and
      # feature versions. "Which policy produced this alert" has to have an
      # answer independent of "which model", so change anything below and this
      # moves.
      #
      # 1.1.0 since the alerting rule below joined it. ADR-0008 section 4 calls
      # that rule "the alerting policy applied to a final score at runtime", so
      # it is this object rather than a second one - and adding it changed what
      # this version describes, which is exactly when a version moves.
      version: ${SENTINELFLOW_RISK_POLICY_VERSION:1.1.0}
      # final = max(rule, 0.6 x model + 0.4 x rule) when the model answered,
      # and the rule score unchanged when it did not.
      #
      # The weighted part is why the model is here: it finds shapes the rules
      # miss, which is the whole of ADR-0010 section 5's margin. The floor is
      # why the rules are here: without it a model scoring 0 on a transaction
      # that tripped three rules drags the final score to 40% of what the rules
      # said, and a transparent indicator an analyst would act on is diluted by
      # a number they cannot inspect.
      model-weight: ${SENTINELFLOW_RISK_POLICY_MODEL_WEIGHT:0.6}
      # Inclusive lower bounds, ascending, starting at zero. Validated at
      # startup: a gap or an inversion is refused rather than clamped, because a
      # band table that silently reorders itself produces assessments nobody can
      # explain.
      #
      # A starting point, not a measurement. The model's operating point sits at
      # 99.9998 on this scale, so almost nothing scores between 40 and 90 today.
      # That is a property of a saturated score distribution, it is recorded in
      # docs/ml/EVALUATION.md, and it is a reason to revisit these against
      # measured alert volume in Phase 5.
      band-lower-bounds:
        LOW: 0
        MEDIUM: 40
        HIGH: 70
        CRITICAL: 90

      # The least severe band worth a human's time. Every band at or above it
      # raises an alert and every band below it does not: an alerting rule that
      # was not monotone in severity would be one nobody could hold in their
      # head.
      #
      # HIGH, which given the bounds above means a final score of 70. That is a
      # starting point and not a measurement - docs/ml/EVALUATION.md records
      # that the score distribution is saturated, so almost nothing lands
      # between 40 and 90 - and it is the number to revisit first against
      # measured alert volume and a stated review capacity. Change it and the
      # policy version above moves with it.
      #
      # This number and the floor above decide something together that neither
      # decides alone: with a rule score of zero the combination caps at
      # model-weight x 100 = 60, which is below 70, so a transaction that trips
      # no transparent indicator cannot open an alert however confident the
      # model is. That is intended and is ADR-0011 section 4; move either number
      # and the implication moves with it, which is why two tests assert it.
      alert-from-band: ${SENTINELFLOW_RISK_POLICY_ALERT_FROM_BAND:HIGH}

      # What the queue does with an alert, per alerting band. Separate from the
      # band because the band describes the score and the priority describes the
      # queue: an operations team must be able to reorder its own work without
      # anyone re-deciding what a score meant.
      #
      # Every alerting band needs one and no other band may have one. Both are
      # refused at startup rather than defaulted - a missing priority would
      # surface as an exception on the first alert of that band, and a priority
      # on a band that does not alert is dead configuration that reads as though
      # it does something.
      priority-by-band:
        HIGH: HIGH
        CRITICAL: URGENT

    rules:
      # The transparent rule indicators (ADR-0002 section 3, ADR-0008 section 3).
      # These run in-process, in the same transaction as the assessment, because
      # they are what answers when the scoring service cannot be reached - a
      # ruleset reached over the network could not answer "the network is down".
      #
      # Illustrative synthetic indicators, not any institution's fraud rules.
      #
      # Persisted on every assessment beside the model and feature versions. A
      # rule score months old cannot be defended without knowing which weights
      # produced it, so change a weight or a threshold and this moves.
      version: ${SENTINELFLOW_RISK_RULES_VERSION:1.0.0}

      # Thresholds. Each is the value at which the indicator starts firing, and
      # each is stated here rather than compiled in because it is an operational
      # decision on a different schedule from the code that evaluates it. What is
      # NOT configuration is which indicators exist: an indicator has a
      # definition, and a definition is not a number.
      #
      # Four transactions inside five minutes. Ordinary retail spending does not
      # cluster that tightly; a card being tested does.
      velocity-5m-count: ${SENTINELFLOW_RISK_RULES_VELOCITY_5M_COUNT:4}
      # Five times this account's OWN recent mean, never a global figure. An
      # absolute amount threshold fires on every wealthy customer and never on a
      # drained student account.
      amount-ratio: ${SENTINELFLOW_RISK_RULES_AMOUNT_RATIO:5.0}
      # Half the balance in one transaction.
      balance-drain-ratio: ${SENTINELFLOW_RISK_RULES_BALANCE_DRAIN_RATIO:0.5}
      # Four distinct merchants within the hour, which is what card testing looks
      # like from the account's side.
      distinct-merchants-1h-count: ${SENTINELFLOW_RISK_RULES_DISTINCT_MERCHANTS_1H_COUNT:4}

      # Weights, on the contract's 0-to-100 scale. They sum to 110 deliberately:
      # the score is clipped at 100, so a transaction tripping several strong
      # indicators reaches the top of the scale, which is a real answer.
      # Normalising instead would make each weight a fraction of a total that
      # changes whenever a rule is added, so today's numbers would quietly mean
      # something different tomorrow.
      #
      # Every rule needs a weight. An absent one is rejected at startup rather
      # than defaulted to zero, because retiring a rule is a decision and not
      # something a typo should be able to do.
      weights:
        VELOCITY_5M_HIGH: 25
        AMOUNT_RATIO_HIGH: 20
        NEW_DEVICE: 15
        COUNTRY_CHANGE: 15
        BALANCE_DRAIN_HIGH: 15
        OFF_HOURS: 10
        DISTINCT_MERCHANTS_1H_HIGH: 10

  seed:
    enabled: ${SENTINELFLOW_SEED_ENABLED:false}
    # The same value produces the same dataset on any machine, which is what
    # makes "reproduce it with seed 20260826" a usable instruction. Quote it in
    # a bug report; pin it in CI.
    seed: ${SENTINELFLOW_SEED:20260826}
    # CI, DEMO or LOCAL. Named sizes rather than a free-form count, so a test
    # and a README cannot drift apart about what "the demo dataset" is.
    profile: ${SENTINELFLOW_SEED_PROFILE:DEMO}
    # Whether to lay generated traffic over the seeded parties. On, because
    # customers and accounts with no transactions are not a demo. Turned off by
    # a test that wants the parties and nothing else.
    scenarios: ${SENTINELFLOW_SEED_SCENARIOS:true}
    # The password every seeded operator is given. NO USABLE DEFAULT, and
    # required whenever seeding is enabled (ADR-0012 section 6): a value written
    # here would be the same password on every machine that ever ran the seed,
    # and a hash committed to a migration would be worse. An application that is
    # not seeding needs none, which is why this is checked against `enabled`
    # rather than on its own. `make bootstrap` generates one into .env.
    operator-password: ${SENTINELFLOW_DEMO_OPERATOR_PASSWORD:}

  security:
    jwt:
      # NO USABLE DEFAULT: a default secret is a secret everybody has, and this
      # one signs operator tokens. The empty placeholder resolves to nothing and
      # JwtProperties then refuses to start, which fails as loudly as an
      # unresolved placeholder would and says what to set instead of which
      # property could not be bound. `make bootstrap` generates one into .env.
      secret: ${SENTINELFLOW_JWT_SECRET:}
      # Short, because a stateless token cannot be revoked before it expires -
      # so this is the whole of how long a withdrawn role keeps working
      # (ADR-0012 section 3). Refused above twelve hours.
      expiry: ${SENTINELFLOW_JWT_EXPIRY:30m}
      # The iss claim, checked on the way back in. Without it a token signed for
      # another environment with the same secret would verify here.
      issuer: ${SENTINELFLOW_JWT_ISSUER:sentinelflow-api}
    cors:
      # Which web origins a browser may let read this API (ADR-0013). This one
      # DOES default where the JWT secret does not: a default secret is a
      # credential everybody has, while a default origin list grants nothing to
      # anybody who cannot already reach this machine's loopback interface - and
      # a demo that will not start until an unguessable variable is set is a
      # demo nobody runs.
      #
      # The two entries are the compose console (WEB_PORT, published on 5173)
      # and the Vite dev server (5174, moved off 8080 where it collided with
      # this service). Comma-separated; every entry is validated at startup, and
      # "*" is refused with a message saying why.
      allowed-origins: ${SENTINELFLOW_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

server:
  port: ${SENTINELFLOW_API_PORT:8080}
  # Give in-flight requests a chance to finish when the container is stopped;
  # the local stack relies on this for a clean `make down`.
  shutdown: graceful
  error:
    # Never leak a stack trace to a client.
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        # Only what operations actually needs. Everything else stays closed.
        include: health,info,prometheus
  endpoint:
    health:
      # Liveness and readiness are separate concerns: a process that is up but
      # cannot reach PostgreSQL is live and not ready.
      probes:
        enabled: true
      show-details: when-authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      # Every trace, locally, and that is a statement about this traffic rather
      # than a default nobody thought about (ADR-0016 section 5). This stack
      # produces transactions in bursts from `make seed` and `make replay` and
      # is otherwise idle: sampling one in ten of a four-record burst gives a
      # trace view that is empty when somebody looks at it. The first number to
      # change if this ever runs anywhere continuous.
      probability: ${SENTINELFLOW_TRACING_SAMPLE_RATE:1.0}

  otlp:
    tracing:
      endpoint: ${SENTINELFLOW_OTLP_ENDPOINT:http://otel-collector:4318/v1/traces}
      export:
        # Off unless something is listening. The exporter retries a connection
        # it cannot make, so a developer running the API outside compose would
        # otherwise get a periodic stack trace about a collector they never
        # asked for. compose.yaml turns it on, where the collector exists.
        #
        # Tracing itself stays on either way, which is the point of splitting
        # these two: spans are still created, so trace and span ids reach the
        # MDC and every log line carries them even when nothing is collecting.
        enabled: ${SENTINELFLOW_OTLP_EXPORT_ENABLED:false}

  metrics:
    tags:
      application: sentinelflow-api
    distribution:
      # Buckets for the HTTP timer, so a dashboard can compute a percentile with
      # histogram_quantile (ADR-0016 section 3). Deliberately NOT
      # percentiles-histogram, which would publish Micrometer's full default
      # bucket set - roughly seventy series for every uri, method and status
      # combination this API serves. These eight boundaries are the ones an
      # operator reads a web request against, and they cost eight.
      #
      # Not percentiles either: a percentile computed inside one process cannot
      # be averaged, summed or re-windowed afterwards, so it answers only the
      # question the process was already asked.
      slo:
        http.server.requests: 10ms,25ms,50ms,100ms,250ms,500ms,1s,2s

logging:
  # JSON in a container, human-readable text on a developer's terminal
  # (ADR-0016 section 4). The container sets LOGGING_STRUCTURED_FORMAT_CONSOLE
  # to `ecs` in compose.yaml; nothing is set here, because Boot treats an
  # unset value as "the ordinary pattern encoder" and an empty string as a
  # format name it cannot resolve.
  #
  # ecs rather than logstash or gelf: it is a published schema with names for
  # the fields this application already has - a correlation id in the MDC, a
  # logger, a level, an exception - so a collector has somewhere to put them
  # without a mapping written by hand.
  #
  # The format decides how a line is rendered. It decides nothing about what a
  # line may contain: that is the call site's job, and LogRedactionIT is what
  # holds it to it.
  structured:
    ecs:
      service:
        name: sentinelflow-api
        version: ${SENTINELFLOW_GIT_SHA:unknown}
  level:
    root: INFO
    io.github.la3679.sentinelflow: INFO
    # Flyway says which migrations it applied. That line is the only record in
    # the log of what a deployment did to the schema, so it stays at INFO.
    org.flywaydb.core.internal.command: INFO
    # Hibernate logs every aborted statement at WARN with the full SQL and every
    # bound value. Two reasons that is wrong here, and neither is about noise
    # alone.
    #
    # A duplicate idempotency key is *normal traffic* under at-least-once
    # ingestion - the design says so, the service handles it, and the caller
    # gets its original result back. Logging each one at WARN turns the expected
    # path into an alarm, and a log full of warnings nobody should act on is a
    # log nobody reads.
    #
    # The bound values are the problem underneath it: that line prints the
    # amount, the account and merchant references, the device handle and the
