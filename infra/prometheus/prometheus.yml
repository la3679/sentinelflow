# Prometheus scrape configuration for the local SentinelFlow stack.
#
# Only targets that actually expose metrics are listed. A job pointing at a
# service with no /metrics endpoint produces a permanently red target, which
# trains everyone to ignore the target page.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local
    project: sentinelflow

# Alerting rules, one file, mounted read-only at this path by compose.yaml.
#
# They waited for the runbooks rather than landing beside the dashboards: a rule
# with no runbook is a pager nobody knows how to answer, so every rule in there
# carries a `runbook` annotation naming the section of
# docs/operations/RUNBOOKS.md that answers it.
#
# There is no Alertmanager in this stack, so nothing pages anybody. A firing
# rule appears on Prometheus's own Alerts page and can be graphed with ALERTS in
# Grafana. Adding Alertmanager would be a service with no recipient; the rules
# are worth having anyway, because they put the thresholds somewhere they can be
# read and argued with.
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: sentinelflow-api
    # Spring Boot Actuator serves Prometheus text format under /actuator.
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:8080"]
        labels:
          service: sentinelflow-api

  - job_name: sentinelflow-scoring
    metrics_path: /metrics
    static_configs:
      - targets: ["scoring:8000"]
        labels:
          service: sentinelflow-scoring
