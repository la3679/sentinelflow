# nginx configuration for the SentinelFlow console container.
#
# The console is a client-rendered single-page application. Deep links such as
# /alerts/ALT-0007 are routed in the browser, so every path that does not match
# a file must return the application shell rather than 404.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;

    # The SPA build prerenders its shell as _shell.html, not index.html.
    index _shell.html;

    # Do not advertise the server version in responses or error pages.
    server_tokens off;

    # A container-local probe target that does not depend on the application
    # bundle having loaded.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # Fingerprinted assets are immutable: the filename changes when the content
    # does, so a long max-age can never serve a stale bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location / {
        # The shell itself must not be cached, or a deploy leaves browsers
        # loading asset URLs that no longer exist.
        add_header Cache-Control "no-cache" always;

        # Defence in depth. The application backend sets its own headers; these
        # cover the documents this container serves.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        try_files $uri $uri/ /_shell.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
