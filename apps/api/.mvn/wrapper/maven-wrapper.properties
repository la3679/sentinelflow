# Maven Wrapper - https://maven.apache.org/wrapper/
#
# distributionType=only-script keeps a binary out of the repository: the mvnw
# scripts download Maven themselves on first use. Nothing under .mvn/wrapper/
# is a jar, so there is no opaque executable in the tree.
#
# The checksum is mandatory, not decorative. Without it the wrapper trusts
# whatever the distribution URL returns. This value was verified twice on
# 2026-08-25: Apache's published .sha512 for apache-maven-3.9.16-bin.zip matched
# the artifact served by Maven Central byte for byte, and the SHA-256 below was
# computed from that verified artifact.
#
# Maven 3.9.16 is the current stable line. Maven 4.0.0 is still at rc-6 and is
# deliberately not used for a build that must be reproducible by a stranger.
wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.zip
distributionSha256Sum=5af3b743dd8b876b5c45da33b676251e5f1687712644abb4ee519ca56e1d89ce
