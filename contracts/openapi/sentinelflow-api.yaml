openapi: 3.1.0

info:
  title: SentinelFlow API
  version: 1.0.0
  summary: Transaction ingestion, risk assessment, and alert operations over synthetic data.
  description: |
    **SentinelFlow is an independent, educational project operating on fictional
    synthetic data.** It executes no financial transaction and makes no
    financial decision.

    This document is the **baseline contract** for `/api/v1`, written before the
    handlers exist so that implementation is reviewed against it rather than
    the reverse. Endpoints are marked with the phase that delivers them; an
    endpoint present here is not necessarily running yet. See
    `docs/planning/IMPLEMENTATION_PLAN.md`.

    ## Conventions

    - **Money is a decimal string with an explicit currency**, never a JSON
      number. `JSON.parse` produces a `double`, so a JSON number is rounded by
      every JavaScript consumer before application code sees it. See
      [ADR-0007](../../docs/adr/0007-money-identifiers-and-schema-migrations.md).
    - **Identifiers are UUIDv7.** Synthetic references such as `ACC-000123` are
      human-readable handles, never keys.
    - **Timestamps are ISO 8601 UTC** with an explicit offset.
    - **Every list endpoint is paged, with a server-enforced maximum.** An
      endpoint whose response grows with the dataset is a denial-of-service
      primitive.
    - **Errors are RFC 9457 `application/problem+json`** and never contain a
      stack trace, a SQL fragment, or an internal class name.
    - **`X-Correlation-Id`** is accepted on every request and echoed on every
      response, tying an API call to its logs, spans and events.

  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://localhost:8080/api/v1
    description: |
      The local development stack from `compose.yaml`. Binds to the developer's
      own machine and holds only synthetic data. **Not a deployment target.**

tags:
  - name: auth
    description: Operator login. Phase 5.
  - name: transactions
    description: Ingestion and retrieval. Phase 3.
  - name: alerts
    description: The alert workflow. Phase 5.
  - name: reports
    description: Aggregates for the console. Phase 5.
  - name: model
    description: Read-only model and policy metadata. Phase 4.

# Every operation requires a bearer token unless it says otherwise, so an
# endpoint added without thinking about authentication is protected rather than
# exposed. The three exceptions carry `security: []` and each says why.
security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Exchange a password for a token (Phase 5)
      description: |
        Returns a short-lived bearer token carrying the operator's identifier
        and the roles they held at login (ADR-0012).

        **A refusal never says why.** An unknown username, a disabled account
        and a wrong password all answer `401` with the same body: distinguishing
        them would turn an endpoint that is necessarily open into an oracle for
        which usernames exist.

        **There is no refresh token.** The expiry is short instead, because a
        stateless token cannot be revoked before it expires and a refresh flow
        would extend the window a withdrawn role keeps working.
      security: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: The token, and when it stops working.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: The username and password were not accepted.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /transactions:
    post:
      tags: [transactions]
      operationId: ingestTransaction
      summary: Ingest a transaction (Phase 3)
      description: |
        Accepts a transaction, persists it and its outbox record in one
        database transaction, and returns immediately. Scoring happens
        asynchronously; the response is `202 Accepted`, not `201 Created`,
        because the assessment does not exist yet.

        **Idempotent.** `idempotencyKey` is unique per account: resubmitting the
        same key returns the original result rather than creating a second
        transaction.

        **Unauthenticated until Phase 8, deliberately.** This is a
        machine-to-machine surface whose caller is a payment pipeline rather
        than a person, so an operator's password buys nothing here. It needs its
        own credential together with the rate limits and payload bounds that
        belong beside it, which is Phase 8's work. ADR-0012 §5 records it as a
        stated gap rather than an oversight.
      security: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionRequest"
      responses:
        "202":
          description: Accepted for processing.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionAccepted"
        "200":
          description: |
            The idempotency key was already used. The original result is
            returned unchanged, and nothing new was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: |
            The idempotency key was reused with a *different* payload. This is a
            client bug, and returning the original result would hide it.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

    get:
      tags: [transactions]
      operationId: listTransactions
      summary: List transactions (Phase 3)
      description: |
        Paged and filterable. Never unbounded.

        **Newest first, and the ordering is not the caller's to choose** — the
        same decision the alert queue's ordering rests on. A `sort` parameter
        would let a client change which transactions an operator sees first,
        which is an operational decision rather than a display one.

        `riskBand` filters on the band of the transaction's **current**
        assessment, which is its highest version. A rescoring writes a new
        assessment rather than editing one, so a transaction rescored out of a
        band leaves that band for this filter too.

        Readable by any authenticated role, `AUDITOR` included. Unlike `POST`
        on this path, it is authenticated: posting a transaction is a
        machine-to-machine surface, and reading other people's activity is not
        the same permission.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: accountReference
          in: query
          schema:
            $ref: "#/components/schemas/AccountReference"
        - name: riskBand
          in: query
          schema:
            $ref: "#/components/schemas/RiskBand"
        - name: occurredAfter
          in: query
          schema:
            type: string
            format: date-time
        - name: occurredBefore
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: A page of transactions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: |
            `occurredBefore` is not after `occurredAfter`, or `size` is above
            the cap. An inverted window matches nothing, so the honest-looking
            answer is an empty page — which reads as "there were no
            transactions" and is the worst thing an empty page can say when it
            is not true.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /transactions/{transactionId}:
    get:
      tags: [transactions]
      operationId: getTransaction
      summary: Get one transaction (Phase 3)
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/TransactionId"
      responses:
        "200":
          description: The transaction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /transactions/{transactionId}/assessment:
    get:
      tags: [transactions]
      operationId: getTransactionAssessment
      summary: Get a transaction's risk assessment (Phase 4)
      description: |
        `404` while scoring is still in flight is a normal outcome, not an
        error condition: ingestion is asynchronous and the assessment is
        created after the transaction.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/TransactionId"
      responses:
        "200":
          description: The assessment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskAssessment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /alerts:
    get:
      tags: [alerts]
      operationId: listAlerts
      summary: List alerts (Phase 5)
      description: |
        The queue, in the queue's own order: **open work before closed, then by
        priority, then oldest first.**

        **The ordering is not the caller's to choose.** Reordering a review queue
        is an operational decision rather than a display one, and a `sort`
        parameter would let a console quietly change which alerts an analyst sees
        first. Priority is what a priority is for; oldest-first is because work
        that has waited longest should be picked up next.

        Every filter is optional and they combine. Readable by any authenticated
        role, including `AUDITOR`.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/AlertStatus"
        - name: priority
          in: query
          schema:
            $ref: "#/components/schemas/AlertPriority"
        - name: assigneeId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: A page of alerts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertPage"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /alerts/{alertId}:
    get:
      tags: [alerts]
      operationId: getAlert
      summary: Get one alert (Phase 5)
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/AlertId"
      responses:
        "200":
          description: The alert.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /alerts/{alertId}/transition:
    post:
      tags: [alerts]
      operationId: transitionAlert
      summary: Transition an alert (Phase 5)
      description: |
        Moves an alert to a new status. Only transitions the state machine
        permits are accepted; an illegal one is `409`, not `400`, because the
        request is well-formed and the *state* is what rejects it.

        Requires `expectedVersion` for optimistic locking: two analysts acting
        on the same alert must not silently overwrite each other.

        Every transition is written to the audit log with the actor.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/AlertId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertTransitionRequest"
      responses:
        "200":
          description: The alert after the transition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            The caller's role does not permit this transition. An `AUDITOR` is
            read-only, and this is enforced here — the console disabling a
            button is a convenience, never the boundary.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The transition is illegal from the current state, or
            `expectedVersion` is stale.

            An illegal move carries `currentStatus` and `legalTargets`, so a
            client can say what is possible instead. A stale version carries
            `expectedVersion` and `currentVersion`, so it can re-read and decide
            again.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /alerts/{alertId}/assignment:
    put:
      tags: [alerts]
      operationId: assignAlert
      summary: Assign an alert, or release it (Phase 5)
      description: |
        Gives the alert to somebody, or takes it back when `assigneeId` is null.
        One operation for both directions, because the alert holds one assignee
        either way.

        **Idempotent.** Sending the same assignment twice leaves the alert where
        it is and writes nothing the second time — no history row saying it was
        assigned to whoever already held it, and no event announcing a change
        that did not happen.

        **Assignment does not move the alert.** An alert can be given to somebody
        who has not looked at it yet, and an analyst can be reviewing one that is
        formally unassigned. Coupling the two would make the queue lie about one
        of them.

        The assignee must exist, be active, and hold a role that can work an
        alert. An `AUDITOR` is read-only, so assigning one would create work they
        are not permitted to do.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/AlertId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertAssignmentRequest"
      responses:
        "200":
          description: The alert after the assignment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The caller's role does not permit this. An `AUDITOR` is read-only.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            `expectedVersion` is stale, or the investigation is already closed —
            an assignee on a closed alert would sit in "what is on this analyst's
            desk" for ever.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /alerts/{alertId}/notes:
    post:
      tags: [alerts]
      operationId: addAlertNote
      summary: Add a note to an alert (Phase 5)
      description: |
        Appends an analyst's own words to the alert's history.

        **No `expectedVersion`.** A note is appended rather than replacing
        anything, so two analysts writing one at the same time both succeed and
        both notes are kept. The alert row is not touched and its version does
        not move.

        **No event is published.** `alert.updated` describes a change to the
        alert, and this is not one; more importantly, a note is an analyst's own
        words about a transaction, which belongs on a detail page somebody has
        opened rather than on a topic that leaves this service. Read it back
        through `/alerts/{alertId}/history`.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/AlertId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertNoteRequest"
      responses:
        "201":
          description: The history entry that was written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertAction"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The caller's role does not permit this. An `AUDITOR` is read-only.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The investigation is closed, and a note added after a disposition reads as though it informed one.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /alerts/{alertId}/feedback:
    put:
      tags: [alerts]
      operationId: recordAlertFeedback
      summary: Record an analyst's verdict (Phase 5)
      description: |
        The label a future supervised model trains on.

        **Recorded against the assessment, citing the alert.** Rescoring writes a
        new assessment rather than editing one, so a label attached to the alert
        would silently follow a decision it was never given about.

        **One analyst, one verdict, revised rather than repeated.** Sending it
        again replaces the label; it does not add a second, contradictory one.
        Two opposite labels from the same person about the same decision cannot
        both be training data, and nothing could choose between them afterwards.

        `INCONCLUSIVE` exists so somebody who cannot tell is not forced to guess.

        No `expectedVersion`: nobody else can write this row, so there is no
        concurrent writer to lose a race against. Two analysts labelling the same
        assessment differently is not a conflict — it is two opinions, and both
        are kept.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/AlertId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertFeedbackRequest"
      responses:
        "200":
          description: The verdict as it now stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertFeedback"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The caller's role does not permit this. An `AUDITOR` is read-only.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The investigation is closed, and a verdict is part of working the alert.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /alerts/{alertId}/history:
    get:
      tags: [alerts]
      operationId: getAlertHistory
      summary: Get an alert's audit trail (Phase 5)
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/AlertId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: |
            A page of actions taken on this alert, newest first.

            **Readable by any authenticated role, including `AUDITOR`.**
            Read-only describes what somebody may do, not what they may see —
            an auditor who could not read the audit trail would be a
            contradiction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertActionPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /reports/alert-summary:
    get:
      tags: [reports]
      operationId: getAlertSummary
      summary: Count one window of alerts (Phase 5)
      description: |
        Counts the alerts created in a window, by status, priority and band.

        **The window is required and has no default.** A report with no window
        is a report over the whole table, which grows without limit. Defaulting
        it to "the last seven days" would be a number this service invented
        rather than one the caller chose, and a client that did not notice would
        quote a figure about a period it never asked for.

        **`from` is inclusive and `to` is exclusive**, so two adjacent windows
        neither double-count a row on the boundary nor lose it.

        **Not paged, and deliberately.** Six statuses, four priorities and four
        bands are the whole response however many alerts the window holds, so it
        cannot grow with the dataset and a page parameter would be one nobody
        could use.

        **Readable by every authenticated role, including `AUDITOR`.** Nothing
        here mutates anything.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/WindowFrom"
        - $ref: "#/components/parameters/WindowTo"
      responses:
        "200":
          description: The window's counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: |
            The window is inverted or wider than the maximum.

            An inverted window matches no rows, so the honest-looking answer is
            an empty report - which reads as "there were no alerts" and is the
            worst thing a report can say when it is not true. `detail` names
            which of the two rules refused it.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /reports/alerts.csv:
    get:
      tags: [reports]
      operationId: exportAlerts
      summary: Export one window of alerts as CSV (Phase 5)
      description: |
        The same window as the summary, one row per alert, as a downloadable
        file.

        **`text/csv` with `Content-Disposition: attachment`**, and a filename
        naming the window it covers - a file called `export.csv` is one nobody
        can identify a week later.

        **Capped rather than paged.** A report a person opens in a spreadsheet
        is a file, not a cursor, and asking an analyst to stitch four pages
        together in Excel is how a report becomes wrong. A window holding more
        rows than the cap is refused with `413` instead, which says exactly what
        to narrow.

        **Every cell is neutralised against formula injection.** A value
        beginning `=`, `+`, `-`, `@`, tab or carriage return is prefixed with an
        apostrophe, because the alert summary is generated from a transaction
        reference that arrived through an ingestion endpoint left open until
        Phase 8 - so a cell in this file can contain characters somebody outside
        the system chose.

        Line endings are CRLF and the encoding is UTF-8, per RFC 4180.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/WindowFrom"
        - $ref: "#/components/parameters/WindowTo"
      responses:
        "200":
          description: |
            The window as CSV: a header row, then one row per alert, oldest
            first. An empty window returns the header and nothing else - a
            header with no rows is a true answer, where an empty body would be
            indistinguishable from a failure that returned `200`.
          headers:
            Content-Disposition:
              description: |
                `attachment` with a filename of the form
                `sentinelflow-alerts-{from}-to-{to}.csv`.
              schema:
                type: string
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            text/csv:
              schema:
                type: string
                description: |
                  Columns, in order: `alertReference`, `status`, `priority`,
                  `riskBand`, `finalScore`, `assigneeId`, `summary`,
                  `createdAt`, `closedAt`. `finalScore` is a decimal string, and
                  `assigneeId` and `closedAt` are empty when unset.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: |
            The window holds more alerts than one export carries.

            `413` rather than `422`: the request is entirely valid and it is the
            *response* that cannot be produced, so a client should narrow the
            window rather than look for a mistake in what it sent. The problem
            body carries both `rows` and `limit`, so the window can be narrowed
            arithmetically rather than by halving it until it works.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ExportTooLargeProblem"
        "422":
          description: The window is inverted or wider than the maximum.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /models/active:
    get:
      tags: [model]
      operationId: getActiveModel
      summary: Get the active model's metadata (Phase 4)
      description: |
        **Read-only.** Model activation and policy mutation are deliberately not
        exposed in v1: doing so safely needs authorization, validation, rollback
        and audit behaviour that does not exist yet, and a half-built promotion
        endpoint is worse than none.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Metadata for the active model.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelMetadata"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No model has been promoted yet.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A token from `POST /auth/login`, signed by this service and verified
        from its signature alone — no session and no lookup (ADR-0012).

        `sub` is the operator's identifier, because every audit row a mutation
        writes stores it as a foreign key. `roles` carries the roles held **at
        login**, which is what makes `alert_actions.actor_role` an honest record
        of the capacity somebody acted in.

        Enforced from Phase 5. Phase 8 hardens it: a credential for ingestion,
        rate limits, and whatever revocation the demo turns out to need.

  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: |
        Ties this request to its logs, spans and events. Generated by the server
        when absent, and echoed on every response either way.
      schema:
        type: string
        format: uuid

    Page:
      name: page
      in: query
      description: Zero-based page index.
      schema:
        type: integer
        minimum: 0
        default: 0

    Size:
      name: size
      in: query
      description: |
        Page size. **Capped at 200 by the server**, which rejects a larger value
        rather than silently clamping it — silently returning less than was
        asked for is how a client ends up with a quiet data-loss bug.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

    WindowFrom:
      name: from
      in: query
      required: true
      description: |
        Inclusive lower bound on the alert's `createdAt`. ISO 8601 with an
        explicit offset.
      schema:
        type: string
        format: date-time
      example: "2026-08-01T00:00:00Z"

    WindowTo:
      name: to
      in: query
      required: true
      description: |
        **Exclusive** upper bound on `createdAt`, and it must be after `from`.
        The window may not exceed **366 days** - long enough for any review
        period this demo has data for, and short enough that the count behind a
        summary stays a scan of a bounded slice.
      schema:
        type: string
        format: date-time
      example: "2026-08-29T00:00:00Z"

    TransactionId:
      name: transactionId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    AlertId:
      name: alertId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  headers:
    CorrelationId:
      description: The correlation id for this request.
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: The request is malformed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    NotFound:
      description: No such resource.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    UnprocessableEntity:
      description: The request is well-formed but fails validation.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Money:
      type: string
      description: |
        A decimal amount as a **string**, never a JSON number. Scale at most 4,
        matching `NUMERIC(19,4)`. See ADR-0007.
      pattern: '^-?(0|[1-9][0-9]{0,14})(\.[0-9]{1,4})?$'
      examples: ["1249.99", "0.0001"]

    Currency:
      type: string
      description: ISO 4217 alphabetic code. Never implicit.
      pattern: "^[A-Z]{3}$"
      examples: ["USD"]

    Amount:
      type: object
      description: The only shape in which an amount appears in this API.
      properties:
        value:
          $ref: "#/components/schemas/Money"
        currency:
          $ref: "#/components/schemas/Currency"
      required: [value, currency]
      additionalProperties: false

    AccountReference:
      type: string
      pattern: "^ACC-[0-9]{6}$"
      examples: ["ACC-000123"]

    RiskBand:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]

    AlertStatus:
      type: string
      enum: [NEW, IN_REVIEW, ESCALATED, CONFIRMED_SUSPICIOUS, DISMISSED_FALSE_POSITIVE, CLOSED]

    AlertPriority:
      type: string
      enum: [LOW, MEDIUM, HIGH, URGENT]

    ReasonCode:
      type: object
      description: One contributing factor, with how much it contributed.
      properties:
        code:
          type: string
          pattern: "^[A-Z][A-Z0-9_]{2,63}$"
        description:
          type: string
          maxLength: 500
        contribution:
          type: number
          description: |
            How much this factor pushed the score, on the scale its `source`
            uses.

            For a `RULE` it is the configured weight on the 0-to-100 scale, and
            the rule reasons sum to `ruleScore`. For a `MODEL` it is the
            estimator's own signed decomposition, which explains the ranking,
            does not sum to anything, and is only comparable within one
            `modelVersion`.

            **No numeric bound, deliberately.** A log-odds contribution has no
            natural ceiling, and clamping one into a range would change a number
            an analyst reads without saying so.
        source:
          type: string
          enum: [RULE, MODEL]
      required: [code, description, contribution, source]
      additionalProperties: false

    PageMeta:
      type: object
      description: |
        Paging metadata. `totalElements` is a count, not an estimate; if that
        becomes too costly to compute it will be replaced by keyset paging in a
        new version rather than quietly turned into an approximation.
      properties:
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        totalElements: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
      required: [page, size, totalElements, totalPages]
      additionalProperties: false

    Problem:
      type: object
      description: |
        RFC 9457. Never contains a stack trace, a SQL fragment, or an internal
        class name.
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        correlationId: { type: string, format: uuid }
        errors:
          type: array
          description: Field-level validation failures, when applicable.
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
            required: [field, message]
            additionalProperties: false
      required: [type, title, status]

    LoginRequest:
      type: object
      properties:
        username:
          type: string
          maxLength: 64
          description: |
            Bounded but not pattern-checked. A username that cannot exist and
            one that merely does not must be refused identically, and a format
            rejected at the boundary would answer a question the login path
            deliberately does not.
        password:
          type: string
          maxLength: 200
          description: Never logged, never echoed, and never part of any response.
      required: [username, password]
      additionalProperties: false

    TokenResponse:
      type: object
      properties:
        token:
          type: string
          description: The bearer token. A credential for as long as it is valid.
        tokenType:
          type: string
          const: Bearer
          description: |
            What to put before the token in the `Authorization` header. Sent
            rather than assumed, so a client that hardcoded it would be guessing
            correctly rather than knowing.
        expiresAt:
          type: string
          format: date-time
          description: |
            When the token stops working, beside it so a client need not decode
            the token to find out. A client that parsed it for the claim would
            be reading a structure this service is free to change.
        roles:
          type: array
          description: |
            The roles held **at login**, beside the token for the same reason
            the expiry is, and for one purpose only: a console decides which
            controls to *offer* from them. That is a user-experience affordance
            and never an authorization decision, which this API keeps.

            Without this field a client's only options are to decode the token
            — the structure the expiry's description says not to read — or to
            attempt every action and collect the refusals.

            `SYSTEM` never appears here: the system principal has no credential
            and the login path refuses the role besides.
          items:
            type: string
            enum: [ANALYST, ADMINISTRATOR, AUDITOR]
      required: [token, tokenType, expiresAt, roles]
      additionalProperties: false

    TransactionRequest:
      type: object
      properties:
        idempotencyKey:
          type: string
          minLength: 8
          maxLength: 128
          description: Unique per account. Resubmitting returns the original result.
        accountReference:
          $ref: "#/components/schemas/AccountReference"
        merchantReference:
          type: string
          pattern: "^MER-[0-9]{4}$"
        type:
          type: string
          enum: [PURCHASE, REFUND, TRANSFER, WITHDRAWAL, DEPOSIT]
        channel:
          type: string
          enum: [CARD_PRESENT, CARD_NOT_PRESENT, ONLINE_TRANSFER, ATM, DIRECT_DEBIT]
        amount:
          $ref: "#/components/schemas/Amount"
        originCountry:
          type: string
          pattern: "^[A-Z]{2}$"
        deviceReference:
          type: [string, "null"]
          pattern: "^DEV-[0-9a-f]{12}$"
        occurredAt:
          type: string
          format: date-time
          description: When the transaction took place, distinct from when it was ingested.
      required:
        [
          idempotencyKey,
          accountReference,
          merchantReference,
          type,
          channel,
          amount,
          originCountry,
          occurredAt,
        ]
      additionalProperties: false

    TransactionAccepted:
      type: object
      properties:
        transactionId: { type: string, format: uuid }
        transactionReference: { type: string, pattern: "^TXN-[0-9]{6}$" }
        correlationId: { type: string, format: uuid }
        status:
          type: string
          enum: [ACCEPTED]
          description: Accepted for processing. The assessment does not exist yet.
      required: [transactionId, transactionReference, correlationId, status]
      additionalProperties: false

    Transaction:
      type: object
      properties:
        transactionId: { type: string, format: uuid }
        transactionReference: { type: string, pattern: "^TXN-[0-9]{6}$" }
        accountReference:
          $ref: "#/components/schemas/AccountReference"
        merchantReference: { type: string, pattern: "^MER-[0-9]{4}$" }
        merchantCategoryCode: { type: string, pattern: "^[0-9]{4}$" }
        type: { type: string }
        channel: { type: string }
        amount:
          $ref: "#/components/schemas/Amount"
        originCountry: { type: string, pattern: "^[A-Z]{2}$" }
        occurredAt: { type: string, format: date-time }
        ingestedAt: { type: string, format: date-time }
        processingStatus:
          type: string
          enum: [PENDING, ASSESSED, FAILED]
        riskBand:
          oneOf:
            - $ref: "#/components/schemas/RiskBand"
            - type: "null"
          description: Null until an assessment exists.
      required:
        [
          transactionId,
          transactionReference,
          accountReference,
          merchantReference,
          amount,
          occurredAt,
          ingestedAt,
          processingStatus,
        ]
      additionalProperties: false

    TransactionPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        page:
          $ref: "#/components/schemas/PageMeta"
      required: [content, page]
      additionalProperties: false

    RiskAssessment:
      type: object
      properties:
        assessmentId: { type: string, format: uuid }
        transactionId: { type: string, format: uuid }
        ruleScore: { type: number, minimum: 0, maximum: 100 }
        modelScore:
          type: [number, "null"]
          minimum: 0
          maximum: 100
          description: Null when scoring was unavailable and the assessment degraded to rules.
        finalScore: { type: number, minimum: 0, maximum: 100 }
        riskBand:
          $ref: "#/components/schemas/RiskBand"
        degraded:
          type: boolean
          description: Explicit rather than inferred from a null modelScore.
        modelVersion: { type: [string, "null"] }
        featureVersion: { type: [string, "null"] }
        rulesetVersion:
          type: string
          description: |
            The ruleset that produced `ruleScore` and every `RULE` reason.
            Always present, including on a degraded assessment: the rules
            are the half that always runs, and a degraded assessment is
            made of nothing else.
        policyVersion: { type: string }
        reasonCodes:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/ReasonCode"
        scoringLatencyMs: { type: integer, minimum: 0 }
        assessedAt: { type: string, format: date-time }
      required:
        [
          assessmentId,
          transactionId,
          ruleScore,
          modelScore,
          finalScore,
          riskBand,
          degraded,
          rulesetVersion,
          policyVersion,
          reasonCodes,
          assessedAt,
        ]
      additionalProperties: false

    Alert:
      type: object
      properties:
        alertId: { type: string, format: uuid }
        alertReference: { type: string, pattern: "^ALT-[0-9]{4}$" }
        transactionId: { type: string, format: uuid }
        assessmentId: { type: string, format: uuid }
        status:
          $ref: "#/components/schemas/AlertStatus"
        priority:
          $ref: "#/components/schemas/AlertPriority"
        assigneeId: { type: [string, "null"], format: uuid }
        summary: { type: string, maxLength: 500 }
        riskBand:
          $ref: "#/components/schemas/RiskBand"
        finalScore: { type: number }
        version:
          type: integer
          minimum: 0
          description: |
            Optimistic-lock version. Pass it back as `expectedVersion` to mutate.

            **An opaque token.** A newly raised alert is at version 0 and each
            accepted mutation increments it, but a client must never read
            meaning into the magnitude — only compare it for equality. The
            minimum is 0 rather than 1 because the persistence layer seeds a new
            version at 0 and the alternative was a translation layer whose only
            job would be to hide that from a client that cannot interpret it
            anyway. See `docs/adr/0007-*` and the `Alert` JPA mapping.
        legalTargets:
          type: array
          description: |
            The statuses **this caller** may move the alert to next, sorted by
            name. Empty for a terminal alert, and empty for an `AUDITOR`
            whatever the alert's status.

            **A property of the alert and the reader together**, unlike every
            other field here. `CLOSED` is legal from every live status and is an
            administrator's alone, so an analyst reading the same alert is
            offered one fewer target. Answering "legal from this status" and
            leaving a client to subtract the administrative close would put a
            second copy of that rule in every client, and the copy is what goes
            stale.

            **Render controls from this and nothing else.** A client that
            derives the moves from its own copy of the state machine will offer
            buttons this service answers `409` or `403` to.

            The same list, produced by the same code, appears as `legalTargets`
            on the problem body of a refused transition — so what a client was
            offered and what a refusal names cannot disagree.
          items:
            $ref: "#/components/schemas/AlertStatus"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        closedAt: { type: [string, "null"], format: date-time }
      required:
        [
          alertId,
          alertReference,
          transactionId,
          assessmentId,
          status,
          priority,
          summary,
          riskBand,
          finalScore,
          version,
          legalTargets,
          createdAt,
          updatedAt,
        ]
      additionalProperties: false

    AlertAssignmentRequest:
      type: object
      properties:
        assigneeId:
          type: [string, "null"]
          format: uuid
          description: |
            Who to give the alert to, or null to release it back to the queue.
            Null is a release rather than an assignment to nobody, and the audit
            trail records it as `UNASSIGNED`.
        expectedVersion:
          type: integer
          minimum: 0
          description: The version the caller believes the alert is at. A mismatch is a `409`.
        note:
          type: string
          maxLength: 2000
          description: Why, in the actor's own words. Stored on the history row this writes.
      required: [assigneeId, expectedVersion]
      additionalProperties: false

    AlertNoteRequest:
      type: object
      properties:
        note:
          type: string
          minLength: 1
          maxLength: 2000
          description: |
            Sanitised on the way in. Rendered as text, never as markup, and
            escaped in CSV export to prevent spreadsheet formula injection.
      required: [note]
      additionalProperties: false

    FeedbackLabel:
      type: string
      enum: [TRUE_POSITIVE, FALSE_POSITIVE, INCONCLUSIVE]

    AlertFeedbackRequest:
      type: object
      properties:
        label:
          $ref: "#/components/schemas/FeedbackLabel"
        reason:
          type: string
          maxLength: 1000
          description: Why, in the analyst's own words. Stored rather than interpreted.
      required: [label]
      additionalProperties: false

    AlertFeedback:
      type: object
      properties:
        feedbackId: { type: string, format: uuid }
        assessmentId:
          type: string
          format: uuid
          description: The decision this verdict is about. The label belongs to the assessment, not to the alert.
        alertId: { type: [string, "null"], format: uuid }
        actorId: { type: string, format: uuid }
        label:
          $ref: "#/components/schemas/FeedbackLabel"
        reason: { type: [string, "null"], maxLength: 1000 }
        createdAt: { type: string, format: date-time }
      required: [feedbackId, assessmentId, actorId, label, createdAt]
      additionalProperties: false

    AlertPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/Alert"
        page:
          $ref: "#/components/schemas/PageMeta"
      required: [content, page]
      additionalProperties: false

    AlertTransitionRequest:
      type: object
      properties:
        targetStatus:
          $ref: "#/components/schemas/AlertStatus"
        expectedVersion:
          type: integer
          minimum: 0
          description: |
            The version the caller believes the alert is at. A mismatch is a
            `409`, so two analysts cannot silently overwrite each other.

            0 is a legitimate value: it is the version of an alert nobody has
            acted on yet, which is exactly the alert most likely to be
            transitioned first.
        note:
          type: string
          maxLength: 2000
          description: |
            Sanitised on the way in. Rendered as text, never as markup, and
            escaped in CSV export to prevent spreadsheet formula injection.
      required: [targetStatus, expectedVersion]
      additionalProperties: false

    AlertAction:
      type: object
      properties:
        actionId: { type: string, format: uuid }
        alertId: { type: string, format: uuid }
        actorId: { type: string, format: uuid }
        actorRole:
          type: string
          enum: [ANALYST, ADMINISTRATOR, AUDITOR, SYSTEM]
        actionType:
          type: string
          enum: [CREATED, ASSIGNED, UNASSIGNED, TRANSITIONED, NOTE_ADDED, PRIORITY_CHANGED]
        previousStatus:
          oneOf:
            - $ref: "#/components/schemas/AlertStatus"
            - type: "null"
        newStatus:
          oneOf:
            - $ref: "#/components/schemas/AlertStatus"
            - type: "null"
        note: { type: [string, "null"], maxLength: 2000 }
        correlationId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
      required: [actionId, alertId, actorId, actorRole, actionType, occurredAt]
      additionalProperties: false

    AlertActionPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/AlertAction"
        page:
          $ref: "#/components/schemas/PageMeta"
      required: [content, page]
      additionalProperties: false

    AlertSummary:
      type: object
      description: |
        Counts over one window. **Every number here is counted, never
        estimated** - nothing is sampled and nothing is cached, because a figure
        in an operations report that is quietly approximate is worse than no
        figure: it is one somebody will quote.

        The three maps always carry **every** key of their enum, including the
        zeroes. A missing key and a zero are the same fact and a client should
        not have to know that; a chart with a gap where `CRITICAL` should be
        reads as missing data rather than as none.
      properties:
        from:
          type: string
          format: date-time
          description: |
            The window this report covers, echoed back so the answer carries the
            period it is about.
        to: { type: string, format: date-time }
        total: { type: integer, minimum: 0 }
        open:
          type: integer
          minimum: 0
          description: |
            Derived from `closedAt` being absent, not from a list of statuses.
            "Which statuses mean open" is a fact about the state machine, and
            duplicating it here would be a second place to change when a status
            is added.
        closed: { type: integer, minimum: 0 }
        byStatus:
          type: object
          description: One key per `AlertStatus`, zeroes included.
          propertyNames:
            $ref: "#/components/schemas/AlertStatus"
          additionalProperties: { type: integer, minimum: 0 }
        byPriority:
          type: object
          description: One key per `AlertPriority`, zeroes included.
          propertyNames:
            $ref: "#/components/schemas/AlertPriority"
          additionalProperties: { type: integer, minimum: 0 }
        byBand:
          type: object
          description: One key per `RiskBand`, zeroes included.
          propertyNames:
            $ref: "#/components/schemas/RiskBand"
          additionalProperties: { type: integer, minimum: 0 }
      required: [from, to, total, open, closed, byStatus, byPriority, byBand]
      additionalProperties: false

    ExportTooLargeProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          description: |
            A `Problem` carrying both numbers, so a client can compute how much
            to narrow the window by rather than guess at it.
          properties:
            rows:
              type: integer
              minimum: 0
              description: How many alerts the requested window holds.
            limit:
              type: integer
              minimum: 1
              description: The most rows one export carries.
          required: [rows, limit]

    ModelMetadata:
      type: object
      description: |
        Read-only. Includes the limitations of the active model, because a
        metric without its caveats invites a conclusion the metric does not
        support.
      properties:
        modelVersion: { type: string }
        featureVersion: { type: string }
        policyVersion: { type: string }
        status:
          type: string
          enum: [CANDIDATE, ACTIVE, RETIRED]
        trainedAt: { type: string, format: date-time }
        promotedAt: { type: [string, "null"], format: date-time }
        metrics:
          type: object
          description: |
            Evaluation results for imbalanced data. Accuracy is deliberately
            absent: with this class balance it is close to meaningless and
            publishing it invites a false conclusion.
          properties:
            precision: { type: number, minimum: 0, maximum: 1 }
            recall: { type: number, minimum: 0, maximum: 1 }
            prAuc: { type: number, minimum: 0, maximum: 1 }
            operatingThreshold: { type: number, minimum: 0, maximum: 100 }
            evaluatedOnRows: { type: integer, minimum: 1 }
          required: [precision, recall, prAuc, operatingThreshold, evaluatedOnRows]
          additionalProperties: false
        limitations:
          type: array
          description: Known limitations, stated plainly rather than omitted.
          items: { type: string }
      required:
        [modelVersion, featureVersion, policyVersion, status, trainedAt, metrics, limitations]
      additionalProperties: false
