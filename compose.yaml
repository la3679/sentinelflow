# SentinelFlow local development stack.
#
# One command brings up everything the project actually uses. Nothing here is
# aspirational: every service in this file is reachable, has a health check, and
# is depended on by something. The OpenTelemetry Collector is deliberately
# absent until Phase 7 wires tracing - a collector that receives nothing is
# decoration, not infrastructure.
#
#   docker compose up -d --wait     start and block until every service is healthy
#   docker compose down             stop, keeping durable volumes
#   docker compose down -v          stop and destroy data (see `make reset-demo`)
#
# The Makefile wraps these; run `make help`.

name: sentinelflow

services:
  # -------------------------------------------------------------------------
  # Data
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:18.6-alpine
    container_name: sentinelflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinelflow}
      POSTGRES_USER: ${POSTGRES_USER:-sentinelflow}
      # No default. `make bootstrap` generates a local value into .env; a
      # missing variable must fail the stack, not silently start a database
      # with a guessable password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make bootstrap to generate local secrets}
      # Deterministic collation, so ordering does not depend on the host locale.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=en-US --encoding=UTF8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # /var/lib/postgresql, not /var/lib/postgresql/data. From 18 the official
      # image stores the cluster in a major-version subdirectory so that
      # pg_upgrade --link can work across it, and refuses to start when a
      # volume is mounted at the old path.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # -U and -d matter: a bare pg_isready reports the server is accepting
      # connections before the requested database exists during first init.
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-sentinelflow} -d ${POSTGRES_DB:-sentinelflow}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  kafka:
    image: apache/kafka:4.2.1
    container_name: sentinelflow-kafka
    restart: unless-stopped
    environment:
      # KRaft: this broker is also the controller. No ZooKeeper.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-5L6g3nShT-eMCtK--X86sw}
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Two client listeners. Containers reach the broker as kafka:9092; a
      # developer's Kafka CLI on the host reaches it as localhost:29092. One
      # listener cannot serve both, because the advertised host has to resolve
      # for whichever client reads it.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Single broker: every replication factor must be 1, or topic creation
      # blocks waiting for replicas that will never exist.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Off. Topics are created explicitly with the partition count and
      # retention the design calls for, never implicitly with defaults.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "${KAFKA_HOST_PORT:-29092}:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # Asks the broker to answer an admin request rather than checking that a
      # port is open: a listening socket appears well before the broker can
      # serve.
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  # The five topics, created explicitly.
  #
  # ADR-0006 section 3 decided this — "topics are created explicitly, never by
  # broker auto-creation, which is disabled in compose.yaml" — and nothing was
  # ever built to do it. The decision and the disabled setting were both in
  # place, so the stack came up healthy and no message could be published on it.
  # Found by running `make replay` against it for the first time: the producer
  # reported UNKNOWN_TOPIC_OR_PARTITION for ever while every health check stayed
  # green. The Testcontainers suites never saw it, because Testcontainers
  # auto-creates.
  #
  # A one-shot rather than a Makefile target, so `make up` gives a stack that
  # works rather than one that needs a second command nobody knew about.
  # --if-not-exists throughout, so a restart against existing topics is a no-op.
  kafka-topics:
    image: apache/kafka:4.2.1
    container_name: sentinelflow-kafka-topics
    depends_on:
      kafka:
        condition: service_healthy
    # A one-shot: it runs, creates what is missing, and exits. Restarting it
    # would loop forever on a job that is already done.
    restart: "no"
    environment:
      # Three, not one. Per-account ordering is a property of the partition key
      # (ADR-0006 section 3), and on a single-partition topic every ordering
      # assertion passes for the wrong reason — the broker orders everything.
      # Three is enough for a laptop to actually exercise it.
      TOPIC_PARTITIONS: "3"
      # Single broker, so this can only be 1. acks=all is still meaningful: it
      # means the one in-sync replica has the record.
      TOPIC_REPLICATION: "1"
      # Seven days for the operational topics. Thirty for the dead-letter topic,
      # because a record there is waiting for a person to look at it, and the
      # window in which somebody notices, investigates and reprocesses is longer
      # than the window in which a transaction is scored.
      TOPIC_RETENTION_MS: "604800000"
      DLQ_RETENTION_MS: "2592000000"
    command:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        create() {
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
            --create --if-not-exists --topic "$$1" \
            --partitions "$$2" --replication-factor "$${TOPIC_REPLICATION}" \
            --config "retention.ms=$$3"
        }
        create transaction.created.v1        "$${TOPIC_PARTITIONS}" "$${TOPIC_RETENTION_MS}"
        create risk.assessed.v1              "$${TOPIC_PARTITIONS}" "$${TOPIC_RETENTION_MS}"
        create alert.created.v1              "$${TOPIC_PARTITIONS}" "$${TOPIC_RETENTION_MS}"
        create alert.updated.v1              "$${TOPIC_PARTITIONS}" "$${TOPIC_RETENTION_MS}"
        # One partition for the dead-letter topic. Nothing consumes it
        # automatically and an operator reads it by hand, so ordering across the
        # whole topic is worth more here than parallelism nobody uses.
        create transaction.processing.dlq.v1 "1"                    "$${DLQ_RETENTION_MS}"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list

  # -------------------------------------------------------------------------
  # Applications
  # -------------------------------------------------------------------------
  scoring:
    build:
      context: ./apps/scoring
      dockerfile: Dockerfile
    image: sentinelflow/scoring:${SENTINELFLOW_VERSION:-dev}
    container_name: sentinelflow-scoring
    restart: unless-stopped
    environment:
      SENTINELFLOW_SCORING_PORT: "8000"
      SENTINELFLOW_SCORING_LOG_LEVEL: ${SCORING_LOG_LEVEL:-INFO}
      # JSON here and human-readable text on a developer's terminal, which is
      # the default this overrides (ADR-0016 section 4). A log line is only
      # structured if whatever reads it can find the fields, and nothing reads
      # a terminal but a person.
      SENTINELFLOW_SCORING_LOG_FORMAT: ${SCORING_LOG_FORMAT:-json}
      SENTINELFLOW_SCORING_GIT_SHA: ${SENTINELFLOW_GIT_SHA:-unknown}
    ports:
      - "${SCORING_PORT:-8000}:8000"

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: sentinelflow/api:${SENTINELFLOW_VERSION:-dev}
    container_name: sentinelflow-api
    restart: unless-stopped
    environment:
      SENTINELFLOW_API_PORT: "8080"
      # Inside the network the database is reachable as the service name on the
      # container port. POSTGRES_PORT in .env is the port published to the
      # host and is deliberately not used here.
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-sentinelflow}
      POSTGRES_USER: ${POSTGRES_USER:-sentinelflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make bootstrap to generate local secrets}
      # Same reasoning as POSTGRES_HOST: inside the network the broker is the
      # service name on its container port. KAFKA_HOST_PORT in .env publishes a
      # different listener to the host and is deliberately not used here.
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Demo data. Off unless the variable is set, in every environment
      # including this one: a service that populates whatever database it is
      # pointed at is a service nobody can safely point at anything. `make seed`
      # sets it for one recreate of this service and then puts it back.
      SENTINELFLOW_SEED_ENABLED: ${SENTINELFLOW_SEED_ENABLED:-false}
      SENTINELFLOW_SEED: ${SENTINELFLOW_SEED:-20260826}
      SENTINELFLOW_SEED_PROFILE: ${SENTINELFLOW_SEED_PROFILE:-DEMO}
      SENTINELFLOW_SEED_SCENARIOS: ${SENTINELFLOW_SEED_SCENARIOS:-true}
      # The password every seeded operator gets (ADR-0012 section 6). Passed
      # through unset when there is nothing to seed, so a stack started without
      # `make bootstrap` fails on the JWT secret below - which is required
      # always - rather than on this one, which is required only sometimes.
      SENTINELFLOW_DEMO_OPERATOR_PASSWORD: ${SENTINELFLOW_DEMO_OPERATOR_PASSWORD:-}
      # Signs and verifies operator tokens. Required with no default, exactly as
      # POSTGRES_PASSWORD is: a default here would sign valid tokens on every
      # deployment that forgot to override it.
      SENTINELFLOW_JWT_SECRET: ${SENTINELFLOW_JWT_SECRET:?run make bootstrap to generate local secrets}
      # Which web origins a browser may let read this API (ADR-0013). This one
      # defaults where the secret above does not: a default origin list grants
      # nothing to anybody who cannot already reach this machine's loopback
      # interface. The entries are the console below and the Vite dev server.
      SENTINELFLOW_CORS_ALLOWED_ORIGINS: ${SENTINELFLOW_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174}
      # Structured JSON logs in the container, the ordinary pattern encoder on
      # a developer's terminal (ADR-0016 section 4). Set here rather than in
      # application.yaml because Boot reads an unset property as "no structured
      # format" and an empty string as a format name it cannot resolve, so
      # there is no value that means "plain" to write in the file.
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ${API_LOG_FORMAT:-ecs}
      # Stamped into every line's service.version, so a log can be traced back
      # to what produced it. Same variable the scoring service uses.
      SENTINELFLOW_GIT_SHA: ${SENTINELFLOW_GIT_SHA:-unknown}
      # Traces go to the collector, which forwards to Tempo (ADR-0016 section
      # 5). Export is off by default in application.yaml and turned on here,
      # because a developer running the API outside compose has no collector
      # and would otherwise collect a periodic stack trace about one.
      #
      # Deliberately NOT a depends_on: a tracing backend that is down must not
      # stop the pipeline. The exporter retries in the background and the
      # application does not notice.
      SENTINELFLOW_OTLP_EXPORT_ENABLED: ${SENTINELFLOW_OTLP_EXPORT_ENABLED:-true}
      SENTINELFLOW_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      # Every trace. A statement about this traffic rather than a default: the
      # stack is idle between bursts, and sampling a tenth of a four-record
      # replay gives a trace view that is empty when somebody looks at it.
      SENTINELFLOW_TRACING_SAMPLE_RATE: ${SENTINELFLOW_TRACING_SAMPLE_RATE:-1.0}
      # The labelled training export (ADR-0010 section 1). Off unless set, for
      # the same reason as the seed. `make export-dataset` sets it for one
      # recreate of this service and then puts it back.
      SENTINELFLOW_SCORING_EXPORT_ENABLED: ${SENTINELFLOW_SCORING_EXPORT_ENABLED:-false}
      SENTINELFLOW_SCORING_EXPORT_OVERWRITE: ${SENTINELFLOW_SCORING_EXPORT_OVERWRITE:-false}
      # Inside the container. The bind mount below puts it at data/generated/
      # in the repository, where .gitignore already excludes it and where the
      # training command in apps/scoring will look for it.
      SENTINELFLOW_SCORING_EXPORT_DIRECTORY: /var/lib/sentinelflow/training
    volumes:
      # A bind mount rather than a named volume: the whole point of the export
      # is that a file lands somewhere a person and the training command can
      # both reach. A named volume would put it where neither can without
      # `docker cp`.
      - ./data/generated/training:/var/lib/sentinelflow/training
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      # The API owns the schema from Phase 2 onward: it runs Flyway at startup
      # and refuses to start if the mappings and the schema disagree. Kafka is
      # declared now so a broken broker surfaces at `make up` rather than in
      # Phase 3.
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      # The relay starts publishing as soon as the API is up, so the topics have
      # to exist before it does. Auto-creation is off by decision (ADR-0006
      # section 3), which means a missing topic is not a slow start - it is a
      # producer retrying UNKNOWN_TOPIC_OR_PARTITION for ever behind a green
      # health check.
      kafka-topics:
        condition: service_completed_successfully
      # service_started, not service_healthy, and the difference is the whole of
      # ADR-0008 section 3.
      #
      # The scoring service reports 503 on readiness when no model is loaded, so
      # `service_healthy` meant a registry entry the image could not serve
      # stopped the API from starting at all. That is the exact opposite of the
      # design: an unreachable scoring service is what the degraded path exists
      # for, and an API that refuses to start when the model is down cannot
      # degrade to rules because it is not running.
      #
      # It never bit, because the image carries the artifact and reports ready.
      # It is corrected here rather than later because the client that makes
      # degradation real landed in this branch, and a resilience property whose
      # only proof is that nothing has triggered it is not a property.
      #
      # Ordering is still declared: scoring starts first, so the ordinary case
      # is a warm dependency rather than a first transaction scored on a
      # container that is still importing scikit-learn.
      scoring:
        condition: service_started

  web:
    build:
      # The repository root, not apps/web: the Bun workspace root owns the
      # single lockfile, and a frozen install needs it.
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Vite inlines VITE_* at build time, so this is a build argument rather
        # than an environment variable: the value is in the bundle the browser
        # downloads, and changing it means rebuilding the image.
        #
        # It points at the host's published API port, not at http://api:8080 -
        # the request is made by a browser on the host, which cannot resolve a
        # compose service name. Keep it in step with API_PORT and with
        # SENTINELFLOW_CORS_ALLOWED_ORIGINS above.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
    image: sentinelflow/web:${SENTINELFLOW_VERSION:-dev}
    container_name: sentinelflow-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5173}:8080"
    depends_on:
      api:
        condition: service_healthy

  # -------------------------------------------------------------------------
  # Observability
  # -------------------------------------------------------------------------
  # -------------------------------------------------------------------------
  # Tracing
  #
  # Neither of these gates anything. ADR-0016 section 5 makes that a rule rather
  # than an oversight: a tracing backend that is down must not stop the
  # pipeline, so no application depends_on them and the API's exporter is
  # configured to fail quietly. A stack with these two stopped ingests, scores
  # and alerts exactly as before, and loses only the ability to see itself.
  # -------------------------------------------------------------------------
  tempo:
    image: grafana/tempo:2.9.1
    container_name: sentinelflow-tempo
    restart: unless-stopped
    command:
      - -config.file=/etc/tempo/tempo.yaml
    ports:
      # The query API, which Grafana reads through. Published so a trace can be
      # fetched with curl when a dashboard is the thing under suspicion.
      - "${TEMPO_PORT:-3200}:3200"
    volumes:
      - ./infra/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:3200/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.142.0
    container_name: sentinelflow-otel-collector
    restart: unless-stopped
    command:
      - --config=/etc/otel/collector.yaml
    volumes:
      - ./infra/otel/collector.yaml:/etc/otel/collector.yaml:ro
    # No published port. Nothing outside this network sends it spans, and an
    # unauthenticated trace-ingest endpoint on the host is a write surface for
    # no gain.
    expose:
      - "4318"
    depends_on:
      tempo:
        condition: service_healthy
    # NO HEALTHCHECK, deliberately, and this is the one service here without
    # one. The collector image is distroless: no shell, no wget, no curl, so
    # every probe that could be written in this file tests something other than
    # what it claims. `--help` proves the binary exists and says nothing about
    # whether the receiver is listening; a green check that means "the file
    # system has a binary in it" is worse than a blank column, because the
    # column is read as evidence.
    #
    # Nothing depends on it being healthy, so the check would inform a person
    # and nothing else. `docker compose logs otel-collector` is what that person
    # should read - it says how many spans it accepted and exported.

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: sentinelflow-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Bounded retention: this is a laptop, not a monitoring cluster.
      - --storage.tsdb.retention.time=7d
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      api:
        condition: service_healthy
      scoring:
        condition: service_healthy

  grafana:
    image: grafana/grafana:13.2.0
    container_name: sentinelflow-grafana
    restart: unless-stopped
    environment:
      # Local development only. This stack binds to the developer's own machine
      # and holds nothing but synthetic data; it is never a deployment target.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run make bootstrap to generate local secrets}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # No outbound calls from a local-first stack.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      prometheus:
        condition: service_healthy

volumes:
  postgres-data:
  kafka-data:
  prometheus-data:
  grafana-data:
  tempo-data:
