name: Documentation problem
description: Documentation is wrong, missing, or contradicts the code.
labels: ["type:docs"]
body:
  - type: markdown
    attributes:
      value: |
        Documentation that drifts from the code is treated as a defect in this
        repository, not a nice-to-have.

  - type: input
    id: location
    attributes:
      label: Where
      description: The file, and a heading or line number.
      placeholder: README.md, "Quickstart"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is wrong
      description: What it says, and what is actually true.
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested wording
      description: Optional, but it makes the fix much faster.
    validations:
      required: false
